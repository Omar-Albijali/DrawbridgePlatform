name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gradle-checks:
    name: Gradle checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Run shared and server tests
        run: ./gradlew --no-daemon :shared:allTests :composeApp:allTests :server:test

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Build shared JS package
        run: ./gradlew --no-daemon :shared:jsBrowserDevelopmentLibraryDistribution

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

  android-debug:
    name: Android debug compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Compile Android debug apps
        run: ./gradlew --no-daemon :androidApp:compileDebugKotlinAndroid :PosDemoClient:androidApp:compileDebugKotlinAndroid

  desktop:
    name: Desktop build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Build desktop apps
        run: ./gradlew --no-daemon :desktopApp:build :PosDemoClient:desktopApp:build

  server-build:
    name: Server build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Build server
        run: ./gradlew --no-daemon :server:build

  ios-build:
    name: iOS builds
    runs-on: macos-latest
    env:
      IOS_ARCH: arm64
      IOS_DESTINATION: generic/platform=iOS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Build main iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/ios-main" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="$IOS_ARCH" \
            build

      - name: Build POS iOS app
        run: |
          xcodebuild \
            -project PosDemoClient/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/ios-pos" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="$IOS_ARCH" \
            build
