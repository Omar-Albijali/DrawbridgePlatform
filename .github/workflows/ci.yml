name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.filter.outputs.should-run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if ! BASE_SHA="$(git rev-parse "$HEAD_SHA^" 2>/dev/null)"; then
              echo "should-run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"

          if grep -Eq '^(iosApp/|PosDemoClient/iosApp/|composeApp/|PosDemoClient/composeApp/|shared/|gradle/|\.github/workflows/ci\.yml|\.github/actions/setup-build/|build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|.*\.gradle\.kts$)' "$RUNNER_TEMP/changed-files"; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  gradle-checks:
    name: Gradle checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Run shared and server tests
        run: ./gradlew --no-daemon :shared:allTests :composeApp:allTests :server:test

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Build shared JS package
        run: ./gradlew --no-daemon :shared:jsBrowserDevelopmentLibraryDistribution

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

  android-debug:
    name: Android debug compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Compile Android debug apps
        run: ./gradlew --no-daemon :androidApp:compileDebugKotlinAndroid :PosDemoClient:androidApp:compileDebugKotlinAndroid

  desktop:
    name: Desktop build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Build desktop apps
        run: ./gradlew --no-daemon :desktopApp:build :PosDemoClient:desktopApp:build

  server-build:
    name: Server build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Build server
        run: ./gradlew --no-daemon :server:build

  ios-main-build:
    name: iOS main build
    needs: ios-changes
    if: needs.ios-changes.outputs.should-run == 'true'
    runs-on: macos-latest
    env:
      IOS_ARCH: arm64
      IOS_DESTINATION: generic/platform=iOS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Build main iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/ios-main" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="$IOS_ARCH" \
            build

  ios-pos-build:
    name: iOS POS build
    needs: ios-changes
    if: needs.ios-changes.outputs.should-run == 'true'
    runs-on: macos-latest
    env:
      IOS_ARCH: arm64
      IOS_DESTINATION: generic/platform=iOS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-build

      - name: Build POS iOS app
        run: |
          xcodebuild \
            -project PosDemoClient/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/ios-pos" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="$IOS_ARCH" \
            build

  ios-builds:
    name: iOS builds
    needs:
      - ios-changes
      - ios-main-build
      - ios-pos-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check iOS build status
        env:
          SHOULD_RUN: ${{ needs.ios-changes.outputs.should-run }}
          DETECT_RESULT: ${{ needs.ios-changes.result }}
          MAIN_RESULT: ${{ needs.ios-main-build.result }}
          POS_RESULT: ${{ needs.ios-pos-build.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "Could not determine whether iOS builds should run. detect=$DETECT_RESULT"
            exit 1
          fi

          if [ "$SHOULD_RUN" != "true" ]; then
            echo "Skipped iOS builds because no iOS integration inputs changed."
            exit 0
          fi

          if [ "$MAIN_RESULT" != "success" ] || [ "$POS_RESULT" != "success" ]; then
            echo "iOS builds did not both pass. main=$MAIN_RESULT pos=$POS_RESULT"
            exit 1
          fi

          echo "iOS builds passed."
